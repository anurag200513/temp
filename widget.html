<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThermaGuard Widget</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-glass: rgba(15, 23, 42, 0.45);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --color-cool: #00f2fe;
            --color-normal: #10b981;
            --color-warning: #f59e0b;
            --color-critical: #ef4444;
            --font-sans: 'Outfit', sans-serif;
            --font-mono: 'Space Grotesk', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: var(--font-sans);
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background: transparent;
        }

        /* Desktop wallpaper preview fallback; transparent on mobile */
        @media (min-width: 480px) {
            body {
                background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            }
        }

        /* Widget Container */
        .widget-card {
            width: 100%;
            height: 100%;
            max-width: 350px;
            max-height: 175px;
            aspect-ratio: 2 / 1;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid var(--border-glass);
            border-radius: 24px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Header row */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .title {
            font-size: 0.75rem;
            font-family: var(--font-mono);
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.8px;
        }

        .title i {
            width: 12px;
            height: 12px;
            color: var(--color-cool);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--color-normal);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--color-normal);
        }

        .status-dot.pulse {
            animation: dot-pulse 1.5s infinite;
        }

        @keyframes dot-pulse {
            0% { transform: scale(0.95); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 10px currentColor; }
            100% { transform: scale(0.95); opacity: 0.6; }
        }

        /* Body rows */
        .body-grid {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-grow: 1;
            align-items: center;
            margin: 8px 0;
        }

        .sensor-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
        }

        .sensor-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.8px;
            margin-bottom: 2px;
        }

        .sensor-value-row {
            display: flex;
            align-items: baseline;
            font-family: var(--font-mono);
            font-weight: 700;
        }

        .sensor-num {
            font-size: 1.8rem;
            color: var(--text-primary);
            line-height: 1;
            font-weight: 800;
        }

        .sensor-unit {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-left: 2px;
            font-weight: 500;
        }

        /* Footer info */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 8px;
        }

        .battery-level {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .battery-level i {
            width: 14px;
            height: 14px;
            color: #60a5fa;
        }

        .charging-state {
            color: var(--text-muted);
            font-size: 0.65rem;
        }

        /* Thermal Theme dynamic bindings */
        .widget-card.theme-cool { border-color: rgba(0, 242, 254, 0.35); box-shadow: 0 10px 30px rgba(0, 242, 254, 0.15); }
        .widget-card.theme-normal { border-color: rgba(16, 185, 129, 0.35); box-shadow: 0 10px 30px rgba(16, 185, 129, 0.15); }
        .widget-card.theme-warning { border-color: rgba(245, 158, 11, 0.35); box-shadow: 0 10px 30px rgba(245, 158, 11, 0.2); }
        .widget-card.theme-critical { border-color: rgba(239, 68, 68, 0.55); box-shadow: 0 10px 35px rgba(239, 68, 68, 0.3); animation: alert-pulse 1.5s infinite alternate ease-in-out; }

        .widget-card.theme-cool .title i { color: var(--color-cool); }
        .widget-card.theme-normal .title i { color: var(--color-normal); }
        .widget-card.theme-warning .title i { color: var(--color-warning); }
        .widget-card.theme-critical .title i { color: var(--color-critical); }

        @keyframes alert-pulse {
            0% { border-color: rgba(239, 68, 68, 0.3); }
            100% { border-color: rgba(239, 68, 68, 0.7); }
        }
    </style>
</head>
<body>
    <div class="widget-card theme-glass" id="widgetCard">
        <div class="header">
            <span class="title" id="widgetTitle"><i data-lucide="activity"></i> THERMAWIDGET</span>
            <span class="status-dot pulse" id="widgetStatusDot"></span>
        </div>
        <div class="body-grid">
            <div class="sensor-item">
                <span class="sensor-label">BATTERY</span>
                <div class="sensor-value-row">
                    <span class="sensor-num" id="batTemp">--.-</span>
                    <span class="sensor-unit">°C</span>
                </div>
            </div>
            <div class="sensor-item">
                <span class="sensor-label">CPU CORE</span>
                <div class="sensor-value-row">
                    <span class="sensor-num" id="cpuTemp">--.-</span>
                    <span class="sensor-unit">°C</span>
                </div>
            </div>
        </div>
        <div class="footer">
            <span class="battery-level">
                <i data-lucide="battery" id="batIcon"></i>
                <span id="batPercent">--%</span>
            </span>
            <span class="charging-state" id="chargeState">Discharging</span>
        </div>
    </div>

    <script>
        // Init Lucide
        lucide.createIcons();

        const widgetCard = document.getElementById('widgetCard');
        const widgetStatusDot = document.getElementById('widgetStatusDot');
        const batTempText = document.getElementById('batTemp');
        const cpuTempText = document.getElementById('cpuTemp');
        const batPercentText = document.getElementById('batPercent');
        const chargeStateText = document.getElementById('chargeState');
        const batIcon = document.getElementById('batIcon');

        // Connect to server SSE
        const sse = new EventSource('/api/temp-stream');

        sse.onopen = () => {
            widgetStatusDot.className = 'status-dot pulse';
            widgetStatusDot.style.color = 'var(--color-normal)';
            widgetStatusDot.style.backgroundColor = 'var(--color-normal)';
        };

        sse.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                // Update text
                batTempText.textContent = data.battery_temp.toFixed(1);
                cpuTempText.textContent = data.cpu_temp.toFixed(1);
                batPercentText.textContent = `${data.battery_level}%`;
                chargeStateText.textContent = data.charging_status;

                // Adjust icon based on charging
                if(data.charging_status !== 'Discharging' && data.charging_status !== 'Unknown') {
                    batIcon.setAttribute('data-lucide', 'zap');
                    batIcon.style.color = 'var(--color-warning)';
                } else {
                    batIcon.setAttribute('data-lucide', 'battery');
                    batIcon.style.color = '#60a5fa';
                }

                // Adjust Widget Thermal Border
                const level = getThermalLevel(data.battery_temp);
                widgetCard.className = `widget-card theme-${level}`;

                lucide.createIcons();
            } catch(e) {
                console.error("SSE parsing error", e);
            }
        };

        sse.onerror = () => {
            widgetStatusDot.className = 'status-dot';
            widgetStatusDot.style.color = 'var(--color-critical)';
            widgetStatusDot.style.backgroundColor = 'var(--color-critical)';
            widgetCard.className = 'widget-card';
        };

        function getThermalLevel(temp) {
            if (temp < 30) return 'cool';
            if (temp < 38) return 'normal';
            if (temp < 45) return 'warning';
            return 'critical';
        }
    </script>
</body>
</html>
